<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101010;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 380px;
            padding: 35px;
            background: #1c1c1c;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 40px #000;
        }

        h1 {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 0;
            border-radius: 8px;
            background: #292929;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: 0;
            border-radius: 8px;
            background: #5865f2;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        a {
            color: #7289da;
            cursor: pointer;
            text-decoration: none;
        }

        .error {
            color: #ff7070;
        }

        .hidden {
            display: none;
        }

        #game {
            text-align: center;
        }

        .logout {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #e74c3c;
            border-radius: 8px;
            color: white;
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="login">

    <h1>Welcome Back</h1>

    {% for msg in get_flashed_messages() %}
        <p class="error">{{ msg }}</p>
    {% endfor %}

    <form method="POST" action="/">
        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">LOGIN</button>
    </form>

    <p>
        Don't have an account?
        <a onclick="showSignup()">Sign Up</a>
    </p>

</div>


<!-- SIGN UP -->
<div class="box hidden" id="signup">

    <h1>Create Account</h1>

    <form method="POST" action="/signup">

        <input
            type="text"
            name="username"
            placeholder="Username"
            minlength="3"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            minlength="6"
            required
        >

        <button type="submit">CREATE ACCOUNT</button>

    </form>

    <p>
        Already have an account?
        <a onclick="showLogin()">Login</a>
    </p>

</div>


<script>
function showSignup() {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("signup").classList.remove("hidden");
}

function showLogin() {
    document.getElementById("signup").classList.add("hidden");
    document.getElementById("login").classList.remove("hidden");
}
</script>

</body>
</html>
